name: maranatha_app
description: Application mobile du Ministère Maranatha — prédications en direct.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Notifications locales
  flutter_local_notifications: ^17.2.2

  # WebView — affiche le site web dans l'app
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.1

  # Stockage local (token FCM)
  shared_preferences: ^2.3.2

  # Appels HTTP (inscription FCM)
  http: ^1.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
