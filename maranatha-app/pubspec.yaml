name: maranatha_app
description: Application mobile du Ministère Maranatha — prédications en direct.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Notifications locales (affichage sur l'écran du téléphone)
  flutter_local_notifications: ^17.2.2

  # Lecteur audio MP3 depuis URL
  audioplayers: ^6.0.0

  # Appels HTTP vers le backend
  http: ^1.2.2

  # Stockage local (pour sauvegarder l'ID utilisateur)
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
