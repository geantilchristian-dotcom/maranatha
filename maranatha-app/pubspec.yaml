name: maranatha_app
description: Application mobile du Ministère Maranatha — prédications en direct.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.1
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.jpg
  min_sdk_android: 21
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icon/icon.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
