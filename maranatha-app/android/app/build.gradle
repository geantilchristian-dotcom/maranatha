plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.maranatha.app"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.maranatha.app"
        minSdkVersion = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Signature de test. Remplacer par une clé de production avant Play Store.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring(
        "com.android.tools:desugar_jdk_libs:2.1.5"
    )

    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-messaging"
}

if (System.getenv("GITHUB_ACTIONS") == "true") {
    tasks.named("assembleRelease").configure {
        doLast {
            def sourceApk = file("${buildDir}/outputs/flutter-apk/app-release.apk")
            def repositoryDir = rootProject.projectDir.parentFile.parentFile
            def publishedApk = new File(repositoryDir, "public/downloads/MARANATHA.apk")

            if (!sourceApk.exists()) {
                throw new GradleException("APK de diffusion introuvable : ${sourceApk}")
            }

            copy {
                from sourceApk
                into publishedApk.parentFile
                rename { "MARANATHA.apk" }
            }

            exec {
                workingDir repositoryDir
                commandLine "git", "config", "user.name", "github-actions[bot]"
            }
            exec {
                workingDir repositoryDir
                commandLine "git", "config", "user.email",
                    "41898282+github-actions[bot]@users.noreply.github.com"
            }
            exec {
                workingDir repositoryDir
                commandLine "git", "add", "public/downloads/MARANATHA.apk"
            }

            def stagedChanges = exec {
                workingDir repositoryDir
                commandLine "git", "diff", "--cached", "--quiet"
                ignoreExitValue true
            }

            if (stagedChanges.exitValue != 0) {
                exec {
                    workingDir repositoryDir
                    commandLine "git", "commit", "-m", "Publier l’APK Android 1.3.0"
                }
                exec {
                    workingDir repositoryDir
                    commandLine "git", "push"
                }
            }
        }
    }
}
