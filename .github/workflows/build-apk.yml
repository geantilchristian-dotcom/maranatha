name: Build APK Maranatha

on:
  push:
    branches: [ main, master ]
    paths:
      - 'maranatha-app/**'
  workflow_dispatch:   # Permet de lancer manuellement depuis GitHub

jobs:
  build:
    name: Compiler APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Telecharger le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Installer les dependances Flutter
        working-directory: maranatha-app
        run: flutter pub get

      - name: Verifier le code
        working-directory: maranatha-app
        run: flutter analyze --no-fatal-infos

      - name: Compiler l'APK (release)
        working-directory: maranatha-app
        run: flutter build apk --release --no-shrink

      - name: Publier l'APK comme artefact telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: maranatha-release-apk
          path: maranatha-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Afficher la taille de l'APK
        working-directory: maranatha-app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "APK compile avec succes ! Taille : $SIZE"
          fi
