name: Créer un APK Maranatha

on:
  push:
    branches: [ main ]
    paths:
      - 'maranatha-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Compiler APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        working-directory: maranatha-app
        run: flutter pub get

      - name: Compiler l'APK
        working-directory: maranatha-app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: maranatha-apk
          path: maranatha-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Taille de l'APK
        working-directory: maranatha-app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          [ -f "$APK" ] && echo "APK prêt : $(du -sh $APK | cut -f1)" || echo "APK introuvable"
