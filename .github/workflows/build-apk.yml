name: Créer un APK Maranatha

on:
  push:
    branches: [main]
    paths:
      - 'maranatha-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compiler APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Installer Android SDK 36 et NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Vérifier Flutter
        working-directory: maranatha-app
        run: flutter doctor -v

      - name: Installer les dépendances
        working-directory: maranatha-app
        run: flutter pub get

      - name: Analyser le code
        working-directory: maranatha-app
        run: flutter analyze

      - name: Générer les icônes
        working-directory: maranatha-app
        run: dart run flutter_launcher_icons

      - name: Compiler l'APK
        working-directory: maranatha-app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: maranatha-apk
          path: maranatha-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
