services:
  - type: web
    name: maranatha
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MARANATHA_PUBLIC_URL
        value: https://cemm-eglisemaranatha.site
      - key: ALLOWED_ORIGINS
        value: https://cemm-eglisemaranatha.site,https://www.cemm-eglisemaranatha.site,https://maranatha-1-k6ro.onrender.com
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: KPAY_API_KEY
        sync: false
      - key: KPAY_SECRET_KEY
        sync: false
